  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"b3ea7626-8bd8-4cf6-8a96-9b959f8958a4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:'Inter',sans-serif;background:#f4f5f7;color:#111827}\na,a:hover{color:inherit;text-decoration:none}\ninput,select,textarea{font-family:'Inter',sans-serif;font-size:13.5px;color:#111827;border:1px solid #d1d5db;border-radius:7px;padding:8px 12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}\ninput:focus,select:focus,textarea:focus{border-color:#16A34A;box-shadow:0 0 0 3px rgba(22,163,74,.12)}\nlabel{font-size:12.5px;font-weight:500;color:#374151;display:block;margin-bottom:5px}\n@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}\n.ani{animation:fi .15s ease both}\n.stt-active{background:#f0fdf4!important;color:#15803d!important;border-color:#86efac!important;font-weight:500!important}\n.stt-active .stt-icon{background:#16A34A!important}\n.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:20px;overflow:hidden}\n.card-header{padding:22px 28px 16px}\n.card-header h2{font-size:18px;font-weight:700;color:#111827;margin-bottom:10px}\n.grad-line{height:2px;background:linear-gradient(to right,#16A34A,#4ade80,#bbf7d0);border-radius:1px}\n.row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 28px;border-bottom:1px solid #f3f4f6}\n.row-top{align-items:flex-start}\n.tog{width:44px;height:24px;border-radius:12px;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}\n.tog .k{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .2s}\n.tog.on{background:#16A34A}.tog.on .k{left:calc(100% - 22px)}\n.tog.off{background:#d1d5db}.tog.off .k{left:2px}\n.vp{display:inline-flex;align-items:center;padding:2px 8px;background:#e5e7eb;color:#111827;border-radius:5px;font-size:11.5px;font-weight:600;font-family:'Inter',monospace;cursor:pointer;white-space:nowrap}\n.savebar{display:flex;justify-content:flex-end;gap:10px;padding-bottom:12px}\n.btn-cancel{padding:10px 20px;border-radius:7px;border:1px solid #e5e7eb;background:#fff;font-size:13.5px;font-weight:500;color:#6b7280;cursor:pointer;font-family:'Inter',sans-serif}\n.btn-save{padding:10px 24px;border-radius:7px;border:none;background:#16A34A;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;font-family:'Inter',sans-serif}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;min-height:100vh;background:#f4f5f7;\">\n\n  <!-- Main -->\n  <div style=\"flex:1;display:flex;flex-direction:column;min-width:0;\">\n\n    <!-- Topbar -->\n    <div style=\"height:50px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 26px;gap:8px;flex-shrink:0;position:sticky;top:0;z-index:5;\">\n      <span style=\"font-size:12.5px;color:#6b7280;\">Paramètres<\u002Fspan>\n      <span style=\"color:#d1d5db;\">›<\u002Fspan>\n      <span style=\"font-size:12.5px;color:#6b7280;\">Réglages devis et factures<\u002Fspan>\n      <span style=\"color:#d1d5db;\">›<\u002Fspan>\n      <span style=\"font-size:12.5px;font-weight:600;color:#111827;\">Réglages et numérotation<\u002Fspan>\n      <div style=\"flex:1;\"><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:7px;padding:5px 13px;background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:20px;\">\n        <div style=\"width:6px;height:6px;border-radius:50%;background:#16A34A;\"><\u002Fdiv>\n        <span style=\"font-size:12px;font-weight:500;color:#15803d;\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;display:flex;flex-direction:column;overflow:hidden;\">\n\n      <!-- Horizontal tab bar -->\n      <div style=\"background:#fff;border-bottom:1px solid #e5e7eb;padding:0 28px;display:flex;align-items:stretch;gap:0;flex-shrink:0;overflow-x:auto;\">\n        <div class=\"settings-tab stt-active\" data-tab=\"numerotation\" sc-camel-on-click=\"{{ tabClick }}\" style=\"display:flex;align-items:center;gap:8px;padding:14px 18px;font-size:13.5px;font-weight:500;cursor:pointer;color:#16A34A;border-bottom:2.5px solid #16A34A;white-space:nowrap;\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><rect x=\"1\" y=\"1\" width=\"4.5\" height=\"4.5\" rx=\"1\" fill=\"#16A34A\" opacity=\".9\"><\u002Frect><line x1=\"7.5\" y1=\"3.3\" x2=\"13\" y2=\"3.3\" stroke=\"#16A34A\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\u002Fline><rect x=\"1\" y=\"8.5\" width=\"4.5\" height=\"4.5\" rx=\"1\" fill=\"#16A34A\" opacity=\".9\"><\u002Frect><line x1=\"7.5\" y1=\"10.8\" x2=\"13\" y2=\"10.8\" stroke=\"#16A34A\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\u002Fline><\u002Fsvg>\n          Réglages et Numérotation\n        <\u002Fdiv>\n        <div class=\"settings-tab\" data-tab=\"dispositions\" sc-camel-on-click=\"{{ tabClick }}\" style=\"display:flex;align-items:center;gap:8px;padding:14px 18px;font-size:13.5px;font-weight:500;cursor:pointer;color:#6b7280;border-bottom:2.5px solid transparent;white-space:nowrap;\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><rect x=\"1\" y=\"1\" width=\"12\" height=\"12\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.2\"><\u002Frect><rect x=\"2.5\" y=\"2.5\" width=\"4\" height=\"3.5\" rx=\".7\" fill=\"#6b7280\" opacity=\".5\"><\u002Frect><line x1=\"8\" y1=\"4\" x2=\"11.5\" y2=\"4\" stroke=\"#6b7280\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\".5\"><\u002Fline><line x1=\"2.5\" y1=\"8.5\" x2=\"11.5\" y2=\"8.5\" stroke=\"#6b7280\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\".5\"><\u002Fline><\u002Fsvg>\n          Dispositions et Couleurs\n        <\u002Fdiv>\n        <div class=\"settings-tab\" data-tab=\"logo\" sc-camel-on-click=\"{{ tabClick }}\" style=\"display:flex;align-items:center;gap:8px;padding:14px 18px;font-size:13.5px;font-weight:500;cursor:pointer;color:#6b7280;border-bottom:2.5px solid transparent;white-space:nowrap;\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><rect x=\"1\" y=\"2.5\" width=\"12\" height=\"9\" rx=\"1.5\" stroke=\"#6b7280\" stroke-width=\"1.2\"><\u002Frect><circle cx=\"4.5\" cy=\"5.5\" r=\"1.3\" stroke=\"#6b7280\" stroke-width=\"1.1\" opacity=\".6\"><\u002Fcircle><path d=\"M1 9.5l3-3 2.5 2.5 2-2 3.5 3\" stroke=\"#6b7280\" stroke-width=\"1.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".6\"><\u002Fpath><\u002Fsvg>\n          Logo et Informations\n        <\u002Fdiv>\n        <div class=\"settings-tab\" data-tab=\"automatisations\" sc-camel-on-click=\"{{ tabClick }}\" style=\"display:flex;align-items:center;gap:8px;padding:14px 18px;font-size:13.5px;font-weight:500;cursor:pointer;color:#6b7280;border-bottom:2.5px solid transparent;white-space:nowrap;\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\"><path d=\"M7.5 1.5L5 7.5h4L6.5 12.5\" stroke=\"#6b7280\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          Automatisations\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Page content -->\n      <div style=\"flex:1;overflow-y:auto;padding:28px 32px;\">\n\n        <!-- ===== 1. RÉGLAGES ET NUMÉROTATION ===== -->\n        <sc-if value=\"{{ isNumerotation }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"ani\">\n          <div style=\"display:flex;align-items:center;gap:5px;font-size:13px;color:#6b7280;margin-bottom:20px;flex-wrap:wrap;\">\n            <span>Panneau d'administration<\u002Fspan><span style=\"color:#d1d5db;\">›<\u002Fspan>\n            <span>Processus de vente<\u002Fspan><span style=\"color:#d1d5db;\">›<\u002Fspan>\n            <span>Devis et factures<\u002Fspan><span style=\"color:#d1d5db;\">›<\u002Fspan>\n            <span style=\"color:#111827;font-weight:600;\">Réglages et numérotation<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"font-size:34px;font-weight:800;color:#111827;line-height:1.1;margin-bottom:10px;\">Réglages et numérotation<\u002Fh1>\n          <p style=\"font-size:14px;color:#16A34A;margin-bottom:6px;\">Activez la fonctionnalité et définissez la numérotation de vos documents.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:28px;cursor:pointer;\">\n            <div style=\"width:18px;height:18px;border-radius:50%;background:#111827;display:flex;align-items:center;justify-content:center;flex-shrink:0;\"><span style=\"color:#fff;font-size:11px;font-weight:700;font-style:italic;\">i<\u002Fspan><\u002Fdiv>\n            <span style=\"font-size:13.5px;color:#111827;font-weight:500;\">Le Centre d'Aide<\u002Fspan>\n          <\u002Fdiv>\n\n          <!-- Réglages généraux -->\n          <div class=\"card\">\n            <div class=\"card-header\"><h2>Réglages généraux<\u002Fh2><div class=\"grad-line\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"row row-top\">\n              <div style=\"flex:1;\"><div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:4px;\">Activer la fonctionnalité de devis et factures<\u002Fdiv><div style=\"font-size:13px;color:#6b7280;line-height:1.5;\">Désactiver la fonctionnalité de devis et factures empêchera les utilisateurs de créer des documents et masquera les liens dans la barre de navigation<\u002Fdiv><\u002Fdiv>\n              <div class=\"tog on\"><div class=\"k\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"row row-top\">\n              <p style=\"flex:1;font-size:13px;color:#374151;line-height:1.6;\">Lorsqu'un devis ou une facture est envoyé(e) à un client, sa modification n'est pas autorisée. Il arrive cependant que vous deviez mettre à jour l'adresse de facturation ou ajouter un numéro de TVA. Le mode flexible permet ces modifications, tandis que le mode strict interdit toute modification d'un devis ou d'une facture publié(e). La modification des brouillons est toujours autorisée.<\u002Fp>\n              <sc-raw-select style=\"width:180px;flex-shrink:0;\"><option>Mode flexible<\u002Foption><option>Mode strict<\u002Foption><\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"row\"><div style=\"font-size:14px;font-weight:600;color:#111827;\">Activer la fonctionnalité de création de devis<\u002Fdiv><div class=\"tog on\"><div class=\"k\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"row\"><div style=\"font-size:14px;font-weight:600;color:#111827;\">Activer la fonctionnalité de création de facture<\u002Fdiv><div class=\"tog on\"><div class=\"k\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"row\" style=\"border-bottom:none;\"><div style=\"font-size:14px;font-weight:600;color:#111827;\">Nombre de décimales pour les montants<\u002Fdiv><input type=\"number\" value=\"2\" style=\"width:90px;text-align:right;\"><\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Numérotation des factures -->\n          <div class=\"card\">\n            <div class=\"card-header\"><h2>Numérotation des factures<\u002Fh2><div class=\"grad-line\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"row row-top\">\n              <div style=\"flex:1;\">\n                <div style=\"font-size:14px;font-weight:700;color:#111827;margin-bottom:4px;\">Mode live<\u002Fdiv>\n                <div style=\"font-size:13px;color:#374151;margin-bottom:3px;\">Activer le mode live pour émettre des factures<\u002Fdiv>\n                <div style=\"font-size:13px;color:#374151;margin-bottom:2px;\">Avant de passer en mode live, définissez soigneusement la numérotation de vos factures.<\u002Fdiv>\n                <div style=\"font-size:13px;color:#374151;margin-bottom:2px;\">Si vous avez déjà facturé un client par le passé, vous devez utiliser la même numérotation et vous assurer qu'il n'y a pas de lacunes dans la numérotation.<\u002Fdiv>\n                <div style=\"font-size:13px;color:#374151;\">Une fois que vous avez activé le mode live et publié au moins une facture, il n'est plus possible de revenir en arrière.<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"tog off\" style=\"margin-top:2px;\"><div class=\"k\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:22px 28px;\">\n              <div style=\"display:flex;gap:22px;align-items:flex-start;margin-bottom:16px;\">\n                <img src=\"601206a7-f0b9-4681-b1a9-1384e44ae7a1\" style=\"width:130px;height:auto;border-radius:8px;flex-shrink:0;display:block;\">\n                <div style=\"flex:1;\">\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;\">\n                    <div><label>Numérotation des factures<\u002Flabel><input type=\"text\" value=\"{{ numFct }}\" sc-camel-on-change=\"{{ updateNumFct }}\"><\u002Fdiv>\n                    <div><label>Aperçu<\u002Flabel><input type=\"text\" value=\"{{ previewFct }}\" readonly=\"\" style=\"background:#f9fafb;color:#6b7280;font-weight:500;\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <p style=\"font-size:13px;color:#374151;line-height:1.5;margin-bottom:2px;\">Vous pouvez composer le modèle de numérotation avec du texte et des variables personnalisés.<\u002Fp>\n                  <p style=\"font-size:13px;color:#374151;\">Cliquez sur n'importe quelle variable ci-dessous pour l'ajouter au modèle, ou modifiez la numérotation directement dans le champ.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;\">\n                <div style=\"border:1px solid #e5e7eb;border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;\">\n                  <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap;\"><span class=\"vp\">&lt;yyyy&gt;<\u002Fspan><span style=\"font-size:13px;color:#6b7280;\">ou<\u002Fspan><span class=\"vp\">&lt;yy&gt;<\u002Fspan><span style=\"font-size:13px;color:#374151;\">l'année en 4 ou 2 chiffres<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap;\"><span class=\"vp\">&lt;mm&gt;<\u002Fspan><span style=\"font-size:13px;color:#6b7280;\">ou<\u002Fspan><span class=\"vp\">&lt;m&gt;<\u002Fspan><span style=\"font-size:13px;color:#374151;\">le mois en 2 ou 1 chiffre(s)<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap;\"><span class=\"vp\">&lt;dd&gt;<\u002Fspan><span style=\"font-size:13px;color:#6b7280;\">ou<\u002Fspan><span class=\"vp\">&lt;d&gt;<\u002Fspan><span style=\"font-size:13px;color:#374151;\">le jour en 2 ou 1 chiffre(s)<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap;\"><span class=\"vp\">&lt;count&gt;<\u002Fspan><span style=\"font-size:13px;color:#374151;\">le compteur, qui augmentera automatiquement<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap;\"><span class=\"vp\">&lt;type&gt;<\u002Fspan><span style=\"font-size:13px;color:#374151;\">correspondant au type de facture.<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                  <div style=\"border:1px solid #e5e7eb;border-radius:8px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;\">\n                    <div style=\"font-size:14px;font-weight:600;color:#111827;\">Taille minimale du compteur<\u002Fdiv>\n                    <input type=\"number\" value=\"6\" style=\"width:80px;text-align:right;\">\n                  <\u002Fdiv>\n                  <div style=\"border:1px solid #e5e7eb;border-radius:8px;padding:16px 18px;\">\n                    <div style=\"font-size:14px;font-weight:600;color:#111827;margin-bottom:6px;\">Réinitialiser la numérotation<\u002Fdiv>\n                    <p style=\"font-size:12.5px;color:#6b7280;line-height:1.5;margin-bottom:12px;\">La réinitialisation mensuelle nécessite &lt;mm&gt; ou &lt;m&gt; et &lt;yyyy&gt; ou &lt;yy&gt;, la réinitialisation annuelle nécessite &lt;yyyy&gt; ou &lt;yy&gt;<\u002Fp>\n                    <sc-raw-select><option>Continu<\u002Foption><option>Mensuelle<\u002Foption><option>Annuelle<\u002Foption><\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f3f4f6;\"><span style=\"font-size:14px;color:#111827;\">Facture standard<\u002Fspan><input type=\"text\" value=\"FCT\" style=\"width:90px;text-align:right;\"><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f3f4f6;\"><span style=\"font-size:14px;color:#111827;\">Facture d'avoir<\u002Fspan><input type=\"text\" value=\"FAV\" style=\"width:90px;text-align:right;\"><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f3f4f6;\"><span style=\"font-size:14px;color:#111827;\">Facture pro forma<\u002Fspan><input type=\"text\" value=\"PRO\" style=\"width:90px;text-align:right;\"><\u002Fdiv>\n
